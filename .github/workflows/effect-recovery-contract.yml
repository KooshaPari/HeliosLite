name: External Effect Recovery Contract

on:
  pull_request:
    paths:
      - "docs/product-contract/20260929-harness-recovery/diagnostics/effect_recovery_probe.py"
      - ".github/workflows/effect-recovery-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  effect-recovery-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run crash-boundary effect recovery contract
        run: python3 docs/product-contract/20260929-harness-recovery/diagnostics/effect_recovery_probe.py
