name: ci
permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - integration/forgecode-h0.1.7
  push:
    branches:
      - main
      - integration/forgecode-h0.1.7

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ci / test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install system deps
        run: sudo apt-get update -q && sudo apt-get install -y libsqlite3-dev protobuf-compiler

      - name: Setup Rust toolchain (stable)
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: stable
          # This action restores ~/.cargo/bin too. A cached bin dir is corrupt
          # and poisons every later run, so never restore or save it (see the
          # Rust cache step below for the observed failures).
          cache-bin: false

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      # Upstream (gfx-rs/wgpu#9543, fixed by #9544): a Rust cache restored from
      # a different runner image version leaves `cargo` resolving to
      # `rustup-init`, so cargo subcommands fail instantly with
      # `unexpected argument`. Include the runner image version in the
      # rust-cache key to keep caches image-version-scoped. The `ImageVersion`
      # env var is provided by GitHub-hosted runner images.
      - name: Export runner image version
        shell: bash
        run: echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"

      - name: Rust cache
        uses: Swatinem/rust-cache@7e35be21c2b94d972b1143087fabc27d7dc881ef
        with:
          key: ${{ env.RUNNER_IMAGE_VERSION }}
          # Do NOT cache/restore ~/.cargo/bin. A previously cached bin dir is
          # corrupt and poisons every later run: on ubuntu the restored `rustc`
          # resolved to the rust-analyzer binary, so `cargo metadata` failed
          # with "parsing `rustc -vV` failed ... output: rust-analyzer
          # 0.3.3049-standalone" (run 35334658326, job 105566604019), and on
          # macos the restored `cargo` rejected every subcommand with
          # `unexpected argument: "<subcommand>"` (run 35334658204).
          # rust-analyzer and cargo-nextest are reinstalled on every run, so
          # caching this directory buys nothing and breaks CI.
          cache-bin: false

      # PR #308 (test(lsp): add e2e integration test against real rust-analyzer
      # binary) added `crates/forge_lsp/tests/e2e_rust_analyzer.rs`, which
      # silently passes when `rust-analyzer` is not on PATH. Installing the
      # prebuilt rust-analyzer here makes the nextest run actually exercise the
      # LSP round-trip instead of taking the early-return skip path.
      # We install rust-analyzer before `Install cargo-nextest` so that the
      # bin dir is populated, then `Rust cache` snapshots the populated dir
      # on its post step, and `Install cargo-nextest` adds cargo-nextest on
      # top without the two installs racing for `$GITHUB_PATH` updates.
      - name: Install rust-analyzer
        shell: bash
        run: |
          set -euo pipefail
          # Install into a dedicated dir, NEVER into $HOME/.cargo/bin: on
          # rustup-based setups `$HOME/.cargo/bin/rust-analyzer` is a symlink to
          # the `rustup` binary, so `> "$bin"` follows it and overwrites rustup
          # itself. Every shim (cargo, rustc, cargo-clippy, ...) then becomes the
          # rust-analyzer binary, producing nonsense like
          # `unexpected argument: "clippy"` (run 35336692859) and
          # `rustc -vV` printing `rust-analyzer 0.3.3049-standalone`
          # (run 35334658326).
          install_dir="$RUNNER_TEMP/rust-analyzer-bin"
          mkdir -p "$install_dir"
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$install_dir/rust-analyzer" ;;
            Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$install_dir/rust-analyzer" ;;
            Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$install_dir/rust-analyzer" ;;
            Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$install_dir/rust-analyzer" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
              asset="rust-analyzer-x86_64-pc-windows-msvc"
              bin="$install_dir/rust-analyzer.exe" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
              asset="rust-analyzer-aarch64-pc-windows-msvc"
              bin="$install_dir/rust-analyzer.exe" ;;
            *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
          # rm first so a stale symlink can never be followed by the redirect.
          rm -f "$bin"
          if [[ "$bin" == *.exe ]]; then
            tmp="$(mktemp -d)/${asset}.zip"
            curl -fsSL "${url}.zip" -o "$tmp"
            unzip -q -o "$tmp" -d "$install_dir"
            rm -rf "$(dirname "$tmp")"
          else
            curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
            chmod +x "$bin"
          fi
          "$bin" --version
          # Put only the isolated dir on PATH for later steps. $GITHUB_PATH is the
          # canonical GH Actions mechanism and, on the windows-2022 image, the
          # only reliable way to extend PATH.
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@c44f6b046f1c29ae5918b1e0bfdbb2f1813836fd
        with:
          tool: cargo-nextest

      - name: Verify toolchain integrity
        shell: bash
        run: |
          set -euo pipefail
          # `cargo metadata` (used by nextest) runs `rustc -vV` and requires a
          # `host: ` line. A corrupt cached ~/.cargo/bin made `rustc` resolve to
          # the rust-analyzer binary, which produced
          # `unexpected flag: --color=always` and exit 2 instead of a useful
          # error (run 35334658326, job 105566604019). Fail loudly here instead.
          # NB: capture first, then match with a here-string. `rustc -vV | grep -q`
          # fails spuriously under `set -o pipefail` because grep exits on the first
          # match and rustc then dies of SIGPIPE.
          rustc_vv="$(rustc -vV 2>&1 || true)"
          if ! grep -q '^host: ' <<<"$rustc_vv"; then
            echo "::error::rustc is not a working compiler: $(command -v rustc)"
            printf '%s\n' "$rustc_vv"
            ls -la "$HOME/.cargo/bin" | head -20
            exit 1
          fi
          printf '%s\n' "$rustc_vv" | grep -E '^(rustc|host):' || true

      - name: cargo nextest run
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          # rustup toolchain bin dir (contains rustc, cargo, etc.)
          RUSTUP_BIN="$(dirname "$(command -v rustc)")"
          export PATH="$RUSTUP_BIN:$HOME/.cargo/bin:$PATH"
          # cargo-nextest is at ~/.cargo/bin; invoke directly to bypass
          # cargo's subcommand lookup which fails when CARGO_HOME is overridden.
          exec "$HOME/.cargo/bin/cargo-nextest" nextest run --all-features --workspace
