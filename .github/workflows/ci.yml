name: ci
on:
  push:
    branches:
    - main
    tags:
    - v*
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - labeled
    - unlabeled
    branches:
    - main
    - integration/**
permissions:
  contents: read
env:
  RUSTFLAGS: -Dwarnings
  OPENROUTER_API_KEY: ${{secrets.OPENROUTER_API_KEY}}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: 'github.event_name != ''pull_request'' || (github.event.action != ''labeled'' && github.event.action != ''unlabeled'') || github.event.label.name == ''ci: build all targets'''
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Install typescript-language-server
      run: |-
        set -euo pipefail
        # forge_lsp::Server::with_defaults spawns BOTH rust-analyzer and
        # typescript-language-server, and crates/forge_lsp/tests/
        # e2e_rust_analyzer.rs exercises that production path whenever
        # rust-analyzer is available. Without the TS server the test panics
        # with `failed to spawn "typescript-language-server"` (run
        # 35339166638, ubuntu). Installing it keeps the e2e test real instead
        # of weakening it.
        npm install -g typescript-language-server typescript
        typescript-language-server --version
      shell: bash
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Install rust-analyzer
      run: |-
        set -euo pipefail
        # Install into a dedicated dir, NEVER into $HOME/.cargo/bin: on
        # rustup-based setups `$HOME/.cargo/bin/rust-analyzer` is a symlink to
        # the `rustup` binary, so `> "$bin"` follows it and overwrites rustup
        # itself. Every shim (cargo, rustc, cargo-clippy, ...) then becomes the
        # rust-analyzer binary, producing nonsense like
        # `unexpected argument: "clippy"` (run 35336692859) and
        # `rustc -vV` printing `rust-analyzer 0.3.3049-standalone`
        # (run 35334658326).
        install_dir="$RUNNER_TEMP/rust-analyzer-bin"
        mkdir -p "$install_dir"
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$install_dir/rust-analyzer" ;;
          Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$install_dir/rust-analyzer" ;;
          Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$install_dir/rust-analyzer" ;;
          Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$install_dir/rust-analyzer" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
            asset="rust-analyzer-x86_64-pc-windows-msvc"
            bin="$install_dir/rust-analyzer.exe" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
            asset="rust-analyzer-aarch64-pc-windows-msvc"
            bin="$install_dir/rust-analyzer.exe" ;;
          *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
        esac
        url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
        # rm first so a stale symlink can never be followed by the redirect.
        rm -f "$bin"
        if [[ "$bin" == *.exe ]]; then
          tmp="$(mktemp -d)/${asset}.zip"
          curl -fsSL "${url}.zip" -o "$tmp"
          unzip -q -o "$tmp" -d "$install_dir"
          rm -rf "$(dirname "$tmp")"
        else
          curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
          chmod +x "$bin"
        fi
        "$bin" --version
        # Put only the isolated dir on PATH for later steps. $GITHUB_PATH is the
        # canonical GH Actions mechanism and, on the windows-2022 image, the
        # only reliable way to extend PATH.
        echo "$install_dir" >> "$GITHUB_PATH"
      shell: bash
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov
    - name: Generate coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
  zsh_rprompt_perf:
    if: 'github.event_name != ''pull_request'' || (github.event.action != ''labeled'' && github.event.action != ''unlabeled'') || github.event.label.name == ''ci: build all targets'''
    name: 'Performance: zsh rprompt'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
    - name: Run performance benchmark
      run: ./scripts/benchmark.sh --threshold 60 zsh rprompt
  draft_release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Draft Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write
    outputs:
      crate_release_name: ${{ steps.set_output.outputs.crate_release_name }}
      crate_release_id: ${{ steps.set_output.outputs.crate_release_id }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - id: create_release
      name: Draft Release
      uses: release-drafter/release-drafter@5a60cd8ddda6dc14fce77159675b8fd2cdca4007
      with:
        config-name: release-drafter.yml
        version: 2.13.21-h.0.1.8
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - id: set_output
      name: Export Outputs
      run: echo "crate_release_id=${{ steps.create_release.outputs.id }}" >> "$GITHUB_OUTPUT" && echo "crate_release_name=${{ steps.create_release.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
  draft_release_pr:
    if: 'github.event_name == ''pull_request'' && contains(github.event.pull_request.labels.*.name, ''ci: build all targets'') && (github.event_name != ''pull_request'' || (github.event.action != ''labeled'' && github.event.action != ''unlabeled'') || github.event.label.name == ''ci: build all targets'')'
    name: Draft Release for PR
    runs-on: ubuntu-latest
    outputs:
      crate_release_name: ${{ steps.set_output.outputs.crate_release_name }}
      crate_release_id: ${{ steps.set_output.outputs.crate_release_id }}
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - id: set_output
      name: Set Release Version
      run: echo "crate_release_name=pr-build-${{ github.event.number }}" >> "$GITHUB_OUTPUT" && echo "crate_release_id=pr-build-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
  build_release_pr:
    if: 'github.event_name == ''pull_request'' && contains(github.event.pull_request.labels.*.name, ''ci: build all targets'') && (github.event_name != ''pull_request'' || (github.event.action != ''labeled'' && github.event.action != ''unlabeled'') || github.event.label.name == ''ci: build all targets'')'
    name: build-release
    runs-on: ${{ matrix.os }}
    needs: draft_release_pr
    strategy:
      matrix:
        include:
        - binary_name: forge-x86_64-unknown-linux-musl
          binary_path: target/x86_64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-x86_64-unknown-linux-musl
          os: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - binary_name: forge-aarch64-unknown-linux-musl
          binary_path: target/aarch64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-musl
          os: ubuntu-latest
          target: aarch64-unknown-linux-musl
        - binary_name: forge-x86_64-unknown-linux-gnu
          binary_path: target/x86_64-unknown-linux-gnu/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-unknown-linux-gnu
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - binary_name: forge-aarch64-unknown-linux-gnu
          binary_path: target/aarch64-unknown-linux-gnu/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-gnu
          os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - binary_name: forge-x86_64-apple-darwin
          binary_path: target/x86_64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-apple-darwin
          os: macos-latest
          target: x86_64-apple-darwin
        - binary_name: forge-aarch64-apple-darwin
          binary_path: target/aarch64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-aarch64-apple-darwin
          os: macos-latest
          target: aarch64-apple-darwin
        - binary_name: forge-x86_64-pc-windows-msvc.exe
          binary_path: target/x86_64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-x86_64-pc-windows-msvc.exe
          helper_name: helioslite_helper-x86_64-pc-windows-msvc.exe
          helper_path: target/x86_64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: x86_64-pc-windows-msvc
        - binary_name: forge-aarch64-pc-windows-msvc.exe
          binary_path: target/aarch64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-aarch64-pc-windows-msvc.exe
          helper_name: helioslite_helper-aarch64-pc-windows-msvc.exe
          helper_path: target/aarch64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: aarch64-pc-windows-msvc
        - binary_name: forge-aarch64-linux-android
          binary_path: target/aarch64-linux-android/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-linux-android
          os: ubuntu-latest
          target: aarch64-linux-android
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Cross Toolchain
      uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8
      with:
        target: ${{ matrix.target }}
    - if: ${{ matrix.cross == 'false' }}
      name: Add Rust target
      run: rustup target add ${{ matrix.target }}
    - if: '!(contains(matrix.target, ''-unknown-linux-'') || contains(matrix.target, ''-android''))'
      name: Set Rust Flags
      run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
    - name: Build Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }}
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        POSTHOG_API_SECRET: ${{secrets.POSTHOG_API_SECRET}}
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
    - name: Build forge_dbd Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_dbd
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
    - if: contains(matrix.target, 'windows')
      name: Build helioslite_helper Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_main --bin helioslite_helper
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ needs.draft_release_pr.outputs.crate_release_name }}
