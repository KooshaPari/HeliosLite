name: Harness Recovery Eval Oracle

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/harness-recovery-eval-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run test:eval-oracle
