name: Multi Channel Release
on:
  release:
    types:
    - published
permissions:
  contents: read
jobs:
  build_release:
    name: build-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - binary_name: forge-x86_64-unknown-linux-musl
          binary_path: target/x86_64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-x86_64-unknown-linux-musl
          os: ubuntu-latest
          target: x86_64-unknown-linux-musl
        - binary_name: forge-aarch64-unknown-linux-musl
          binary_path: target/aarch64-unknown-linux-musl/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-musl
          os: ubuntu-latest
          target: aarch64-unknown-linux-musl
        - binary_name: forge-x86_64-unknown-linux-gnu
          binary_path: target/x86_64-unknown-linux-gnu/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-unknown-linux-gnu
          os: ubuntu-latest
          target: x86_64-unknown-linux-gnu
        - binary_name: forge-aarch64-unknown-linux-gnu
          binary_path: target/aarch64-unknown-linux-gnu/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-unknown-linux-gnu
          os: ubuntu-latest
          target: aarch64-unknown-linux-gnu
        - binary_name: forge-x86_64-apple-darwin
          binary_path: target/x86_64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-x86_64-apple-darwin
          os: macos-latest
          target: x86_64-apple-darwin
        - binary_name: forge-aarch64-apple-darwin
          binary_path: target/aarch64-apple-darwin/release/forge
          cross: 'false'
          helioslite_name: helioslite-aarch64-apple-darwin
          os: macos-latest
          target: aarch64-apple-darwin
        - binary_name: forge-x86_64-pc-windows-msvc.exe
          binary_path: target/x86_64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-x86_64-pc-windows-msvc.exe
          helper_name: helioslite_helper-x86_64-pc-windows-msvc.exe
          helper_path: target/x86_64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: x86_64-pc-windows-msvc
        - binary_name: forge-aarch64-pc-windows-msvc.exe
          binary_path: target/aarch64-pc-windows-msvc/release/forge.exe
          cross: 'false'
          helioslite_name: helioslite-aarch64-pc-windows-msvc.exe
          helper_name: helioslite_helper-aarch64-pc-windows-msvc.exe
          helper_path: target/aarch64-pc-windows-msvc/release/helioslite_helper.exe
          os: windows-latest
          target: aarch64-pc-windows-msvc
        - binary_name: forge-aarch64-linux-android
          binary_path: target/aarch64-linux-android/release/forge
          cross: 'true'
          helioslite_name: helioslite-aarch64-linux-android
          os: ubuntu-latest
          target: aarch64-linux-android
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - if: ${{ matrix.cross == 'false' }}
      name: Setup Cross Toolchain
      uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8
      with:
        target: ${{ matrix.target }}
    - if: ${{ matrix.cross == 'false' }}
      name: Add Rust target
      run: rustup target add ${{ matrix.target }}
    - if: '!(contains(matrix.target, ''-unknown-linux-'') || contains(matrix.target, ''-android''))'
      name: Set Rust Flags
      run: echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
    - name: Build Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }}
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        POSTHOG_API_SECRET: ${{secrets.POSTHOG_API_SECRET}}
        APP_VERSION: ${{ github.event.release.tag_name }}
    - name: Build forge_dbd Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_dbd
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ github.event.release.tag_name }}
    - if: contains(matrix.target, 'windows')
      name: Build helioslite_helper Binary
      uses: ClementTsang/cargo-action@2438cc5f3ba4e971289fffca2a00dedea6911f14
      with:
        command: build --release
        args: --target ${{ matrix.target }} -p forge_main --bin helioslite_helper
        use-cross: ${{ matrix.cross }}
        cross-version: 0.2.5
      env:
        APP_VERSION: ${{ github.event.release.tag_name }}
    - name: Copy Binary
      run: |-
        cp ${{ matrix.binary_path }} ${{ matrix.binary_name }}
        cp ${{ matrix.binary_path }} ${{ matrix.helioslite_name }}
    - name: Generate SHA-256 checksum
      run: if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.binary_name }}" > "${{ matrix.binary_name }}.sha256"; else shasum -a 256 "${{ matrix.binary_name }}" > "${{ matrix.binary_name }}.sha256"; fi
      shell: bash
    - name: Generate helioslite SHA-256 checksum
      run: if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.helioslite_name }}" > "${{ matrix.helioslite_name }}.sha256"; else shasum -a 256 "${{ matrix.helioslite_name }}" > "${{ matrix.helioslite_name }}.sha256"; fi
      shell: bash
    - name: Copy forge_dbd Binary
      run: if [[ "${{ matrix.target }}" == *windows* ]]; then cp "target/${{ matrix.target }}/release/forge_dbd.exe" "forge_dbd-${{ matrix.target }}.exe"; else cp "target/${{ matrix.target }}/release/forge_dbd" "forge_dbd-${{ matrix.target }}"; fi
      shell: bash
    - name: Generate forge_dbd SHA-256
      run: if [[ "${{ matrix.target }}" == *windows* ]]; then if command -v sha256sum >/dev/null 2>&1; then sha256sum "forge_dbd-${{ matrix.target }}.exe" > "forge_dbd-${{ matrix.target }}.exe.sha256"; else shasum -a 256 "forge_dbd-${{ matrix.target }}.exe" > "forge_dbd-${{ matrix.target }}.exe.sha256"; fi; else if command -v sha256sum >/dev/null 2>&1; then sha256sum "forge_dbd-${{ matrix.target }}" > "forge_dbd-${{ matrix.target }}.sha256"; else shasum -a 256 "forge_dbd-${{ matrix.target }}" > "forge_dbd-${{ matrix.target }}.sha256"; fi; fi
      shell: bash
    - if: contains(matrix.target, 'windows')
      name: Copy helioslite_helper Binary
      run: cp "${{ matrix.helper_path }}" "${{ matrix.helper_name }}"
      shell: bash
    - if: contains(matrix.target, 'windows')
      name: Generate helioslite_helper SHA-256 checksum
      run: if command -v sha256sum >/dev/null 2>&1; then sha256sum "${{ matrix.helper_name }}" > "${{ matrix.helper_name }}.sha256"; else shasum -a 256 "${{ matrix.helper_name }}" > "${{ matrix.helper_name }}.sha256"; fi
      shell: bash
    - name: Stage unsigned release assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-assets-unsigned-${{ matrix.target }}
        path: |-
          forge-*
          helioslite-*
          forge_dbd-*
        if-no-files-found: error
  sign_release:
    name: Sign release and regenerate checksums
    uses: ./.github/workflows/sign-release.yml
    secrets:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      MACOS_NOTARIZATION_APPLE_ID: ${{ secrets.MACOS_NOTARIZATION_APPLE_ID }}
      MACOS_NOTARIZATION_PWD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
      MACOS_NOTARIZATION_TEAM_ID: ${{ secrets.MACOS_NOTARIZATION_TEAM_ID }}
      MACOS_NOTARIZATION_API_KEY: ${{ secrets.MACOS_NOTARIZATION_API_KEY }}
      MACOS_NOTARIZATION_KEY_ID: ${{ secrets.MACOS_NOTARIZATION_KEY_ID }}
      MACOS_NOTARIZATION_ISSUER_ID: ${{ secrets.MACOS_NOTARIZATION_ISSUER_ID }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
    with:
      tag: ${{ github.event.release.tag_name }}
    needs: build_release
    permissions:
      contents: write
      actions: read
  sbom_release_assets:
    name: Generate release SBOM
    runs-on: ubuntu-latest
    needs: sign_release
    permissions:
      contents: read
    steps:
    - name: Download staged release assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: release-assets-*
        path: staged-assets
    - name: Assemble signed release assets
      run: |-
        set -euo pipefail
        mkdir -p release-assets
        for asset_dir in staged-assets/*; do
          case "$asset_dir" in
            *unsigned-*-apple-darwin|*unsigned-*-windows-msvc) continue ;;
          esac
          find "$asset_dir" -maxdepth 1 -type f -exec cp {} release-assets/ \;
        done
    - name: Generate CycloneDX SBOM
      uses: anchore/sbom-action@6b92ff5b2cce1787a99198f282dd8a26d1991449
      with:
        path: release-assets
        format: cyclonedx-json
        artifact-name: forgecode-${{ github.event.release.tag_name }}.cdx.json
        output-file: release-assets/sbom.cdx.json
        upload-artifact: 'false'
        upload-release-assets: 'false'
    - name: Stage release SBOM
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-sbom
        path: release-assets/sbom.cdx.json
        if-no-files-found: error
  attest_release_assets:
    name: Attest release assets
    runs-on: ubuntu-latest
    needs: sbom_release_assets
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - name: Download staged release assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: release-assets-*
        path: staged-assets
    - name: Assemble signed release assets
      run: |-
        set -euo pipefail
        mkdir -p release-assets
        for asset_dir in staged-assets/*; do
          case "$asset_dir" in
            *unsigned-*-apple-darwin|*unsigned-*-windows-msvc) continue ;;
          esac
          find "$asset_dir" -maxdepth 1 -type f -exec cp {} release-assets/ \;
        done
    - name: Download release SBOM
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-sbom
        path: release-assets
    - name: Attest release assets
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
      with:
        subject-path: release-assets/*
  publish_release_assets:
    name: Publish verified release assets
    runs-on: ubuntu-latest
    needs: attest_release_assets
    permissions:
      contents: write
    steps:
    - name: Download staged release assets
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        pattern: release-assets-*
        path: staged-assets
    - name: Assemble signed release assets
      run: |-
        set -euo pipefail
        mkdir -p release-assets
        for asset_dir in staged-assets/*; do
          case "$asset_dir" in
            *unsigned-*-apple-darwin|*unsigned-*-windows-msvc) continue ;;
          esac
          find "$asset_dir" -maxdepth 1 -type f -exec cp {} release-assets/ \;
        done
    - name: Download release SBOM
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: release-sbom
        path: release-assets
    - name: Publish verified release assets
      run: |-
        set -euo pipefail
        gh release upload "$RELEASE_TAG" release-assets/* --repo "${{ github.repository }}" --clobber
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
