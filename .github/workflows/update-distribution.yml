name: Update Distribution Files
on:
  release:
    types:
    - published
  # Manual trigger: lets the workflow run against an already-published release
  # (all assets attached) without cutting a new release cycle. Required input
  # `tag` supplies the tag name that the release event would carry.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update manifests for (e.g. v2.13.21-h.0.2.8)
        required: true
        type: string
permissions:
  contents: read
jobs:
  update_distribution:
    name: Update Homebrew, Scoop, and packaging manifests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    - name: Download SHA256 checksums
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag || github.event.release.tag_name }}"
        mkdir -p checksums
        
        # Download all SHA256 files. The release workflow attaches assets
        # concurrently with this run (both trigger on release: published), so a
        # checksum can legitimately be missing for the first tens of minutes.
        # Observed Multi Channel Release attach times: 27m21s, 33m29s, and a
        # 15s lucky win. Retry for up to 45 minutes before failing; a
        # genuinely absent asset still exits 1.
        deadline=$(( SECONDS + 2700 ))
        for asset in forge-x86_64-apple-darwin forge-aarch64-apple-darwin \
                     forge-x86_64-unknown-linux-gnu forge-aarch64-unknown-linux-gnu \
                     forge-x86_64-pc-windows-msvc.exe forge-aarch64-pc-windows-msvc.exe \
                     forge_dbd-x86_64-apple-darwin forge_dbd-aarch64-apple-darwin \
                     forge_dbd-x86_64-unknown-linux-gnu forge_dbd-aarch64-unknown-linux-gnu; do
          ok=0
          while :; do
            if gh release download "$TAG" \
              --repo "${{ github.repository }}" \
              --pattern "${asset}.sha256" \
              --dir checksums; then
              ok=1
              break
            fi
            [ "$SECONDS" -lt "$deadline" ] && sleep 30 || break
          done
          [ "$ok" -eq 1 ] || { echo "::error::Could not download ${asset}.sha256 after ~45 minutes of retries"; exit 1; }
        done
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Extract SHA256 values
      run: |
        set -euo pipefail

        # A missing checksum must fail the run. This previously emitted the
        # literal "MISSING", which was then committed as `sha256 "MISSING"` /
        # `"hash": "MISSING"` — an uninstallable formula/manifest published
        # silently. Fail loudly instead.
        #
        # NB: this is a function, not a command substitution, so `exit 1`
        # terminates the step. A subshell would swallow the status.
        emit_sha() {
          local var="$1" file="$2" value
          if [ ! -f "checksums/${file}.sha256" ]; then
            echo "::error::missing checksum asset: checksums/${file}.sha256" >&2
            exit 1
          fi
          # Extract SHA256 from each file (format: "hash  filename")
          value="$(awk '{print $1}' "checksums/${file}.sha256")"
          if [ -z "$value" ]; then
            echo "::error::empty checksum in checksums/${file}.sha256" >&2
            exit 1
          fi
          echo "${var}=${value}" >> "$GITHUB_ENV"
        }

        # Store in environment
        emit_sha SHA_X86_64_MACOS forge-x86_64-apple-darwin
        emit_sha SHA_AARCH64_MACOS forge-aarch64-apple-darwin
        emit_sha SHA_X86_64_LINUX forge-x86_64-unknown-linux-gnu
        emit_sha SHA_AARCH64_LINUX forge-aarch64-unknown-linux-gnu
        emit_sha SHA_X86_64_WINDOWS forge-x86_64-pc-windows-msvc.exe
        emit_sha SHA_AARCH64_WINDOWS forge-aarch64-pc-windows-msvc.exe
        emit_sha SHA_DBD_X86_64_MACOS forge_dbd-x86_64-apple-darwin
        emit_sha SHA_DBD_AARCH64_MACOS forge_dbd-aarch64-apple-darwin
        emit_sha SHA_DBD_X86_64_LINUX forge_dbd-x86_64-unknown-linux-gnu
        emit_sha SHA_DBD_AARCH64_LINUX forge_dbd-aarch64-unknown-linux-gnu
    - name: Update Homebrew formula
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag || github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        
        cat > distribution/homebrew/forge.rb << EOF
        class Forge < Formula
          desc "Fastest AI coding agent — 40+ models, local-first, zero data exfiltration"
          homepage "https://github.com/KooshaPari/forgecode"
          version "${VERSION}"
          license "MIT"

          on_macos do
            if Hardware::CPU.intel?
              url "https://github.com/KooshaPari/forgecode/releases/download/v#{version}/forge-x86_64-apple-darwin"
              sha256 "${SHA_X86_64_MACOS}"
            else
              url "https://github.com/KooshaPari/forgecode/releases/download/v#{version}/forge-aarch64-apple-darwin"
              sha256 "${SHA_AARCH64_MACOS}"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/KooshaPari/forgecode/releases/download/v#{version}/forge-x86_64-unknown-linux-gnu"
              sha256 "${SHA_X86_64_LINUX}"
            else
              url "https://github.com/KooshaPari/forgecode/releases/download/v#{version}/forge-aarch64-unknown-linux-gnu"
              sha256 "${SHA_AARCH64_LINUX}"
            end
          end

          def install
            bin.install Dir["forge*"].first => "forge"
            bin.install Dir["forge_dbd*"].first => "forge_dbd" if Dir["forge_dbd*"].any?
          end

          test do
            assert_match "forge", shell_output("#{bin}/forge --version")
          end
        end
        EOF
    - name: Update packaging Homebrew formula
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag || github.event.release.tag_name }}"
        VERSION="${TAG#v}"

        # packaging/homebrew/helioslite.rb is the canonical `helioslite`
        # formula. It used to be hand-maintained with a `sha256 "<set at tag
        # time>"` placeholder, which produced an uninstallable formula; it is
        # generated here instead so the digests always come from the release.
        # The template uses a quoted heredoc deliberately. With an unquoted
        # heredoc, backticks and $( ) inside the Ruby body are executed by the
        # shell as command substitutions: a comment that merely named a
        # command would run that command and splice its output into the
        # published formula. Values are injected with sed from @TOKEN@
        # placeholders instead.
        sed \
          -e "s|@VERSION@|${VERSION}|g" \
          -e "s|@SHA_X86_64_MACOS@|${SHA_X86_64_MACOS}|g" \
          -e "s|@SHA_AARCH64_MACOS@|${SHA_AARCH64_MACOS}|g" \
          -e "s|@SHA_X86_64_LINUX@|${SHA_X86_64_LINUX}|g" \
          -e "s|@SHA_AARCH64_LINUX@|${SHA_AARCH64_LINUX}|g" \
          -e "s|@SHA_DBD_X86_64_MACOS@|${SHA_DBD_X86_64_MACOS}|g" \
          -e "s|@SHA_DBD_AARCH64_MACOS@|${SHA_DBD_AARCH64_MACOS}|g" \
          -e "s|@SHA_DBD_X86_64_LINUX@|${SHA_DBD_X86_64_LINUX}|g" \
          -e "s|@SHA_DBD_AARCH64_LINUX@|${SHA_DBD_AARCH64_LINUX}|g" \
          << 'EOF' > packaging/homebrew/helioslite.rb
        # frozen_string_literal: true

        # HeliosLite — canonical `helioslite` formula.
        #
        # This installs prebuilt release binaries rather than building from source.
        # The workspace depends on the `PhenoShared` git repository, so a source build
        # would need a full Rust toolchain plus network access to an unrelated private
        # repo, for a CLI that every supported platform already ships prebuilt.
        #
        # `packaging/homebrew/helioslite.rb` is regenerated by
        # `.github/workflows/update-distribution.yml` on every release, which injects
        # the real `sha256` values from the attached `.sha256` assets. Do not hand-edit
        # the digests: an unreplaced placeholder yields an uninstallable formula.
        class Helioslite < Formula
          desc "AI coding agent CLI — HeliosLite, the KooshaPari fork of tailcallhq/forgecode"
          homepage "https://github.com/KooshaPari/HeliosLite"
          version "@VERSION@"
          license "MIT"

          on_macos do
            if Hardware::CPU.intel?
              url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge-x86_64-apple-darwin"
              sha256 "@SHA_X86_64_MACOS@"
            else
              url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge-aarch64-apple-darwin"
              sha256 "@SHA_AARCH64_MACOS@"
            end
          end

          on_linux do
            if Hardware::CPU.intel?
              url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge-x86_64-unknown-linux-gnu"
              sha256 "@SHA_X86_64_LINUX@"
            else
              url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge-aarch64-unknown-linux-gnu"
              sha256 "@SHA_AARCH64_LINUX@"
            end
          end

          # The storage daemon ships as a separate binary. It is a first-class part of
          # the install, not an optional add-on, so it is a `resource` rather than a
          # best-effort extra.
          resource "forge_dbd" do
            on_macos do
              if Hardware::CPU.intel?
                url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge_dbd-x86_64-apple-darwin"
                sha256 "@SHA_DBD_X86_64_MACOS@"
              else
                url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge_dbd-aarch64-apple-darwin"
                sha256 "@SHA_DBD_AARCH64_MACOS@"
              end
            end

            on_linux do
              if Hardware::CPU.intel?
                url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge_dbd-x86_64-unknown-linux-gnu"
                sha256 "@SHA_DBD_X86_64_LINUX@"
              else
                url "https://github.com/KooshaPari/HeliosLite/releases/download/v#{version}/forge_dbd-aarch64-unknown-linux-gnu"
                sha256 "@SHA_DBD_AARCH64_LINUX@"
              end
            end
          end

          def install
            # The release publishes one binary under both `forge-*` and `helioslite-*`
            # asset names. Install it once and expose the legacy name as a symlink so
            # the two can never drift across upgrades.
            bin.install Dir["forge-*"].first => "helioslite"
            bin.install_symlink "helioslite" => "forge"

            resource("forge_dbd").stage do
              bin.install Dir["forge_dbd-*"].first => "forge_dbd"
            end
          end

          test do
            assert_match version.to_s, shell_output("#{bin}/helioslite --version")
            assert_match version.to_s, shell_output("#{bin}/forge --version")
            # forge_dbd is versioned independently of the workspace, so only assert
            # that it executes rather than pinning it to the release tag.
            assert_match "forge_dbd", shell_output("#{bin}/forge_dbd --version")
          end
        end
        EOF
    - name: Update Scoop manifest
      run: |
        set -euo pipefail
        TAG="${{ inputs.tag || github.event.release.tag_name }}"
        VERSION="${TAG#v}"
        
        cat > distribution/scoop/forge.json << EOF
        {
            "version": "${VERSION}",
            "description": "Fastest AI coding agent — 40+ models, local-first, zero data exfiltration",
            "homepage": "https://github.com/KooshaPari/forgecode",
            "license": "MIT",
            "architecture": {
                "64bit": {
                    "url": "https://github.com/KooshaPari/forgecode/releases/download/v${VERSION}/forge-x86_64-pc-windows-msvc.exe",
                    "hash": "${SHA_X86_64_WINDOWS}",
                    "bin": "forge-x86_64-pc-windows-msvc.exe"
                },
                "arm64": {
                    "url": "https://github.com/KooshaPari/forgecode/releases/download/v${VERSION}/forge-aarch64-pc-windows-msvc.exe",
                    "hash": "${SHA_AARCH64_WINDOWS}",
                    "bin": "forge-aarch64-pc-windows-msvc.exe"
                }
            },
            "checkver": {
                "url": "https://api.github.com/repos/KooshaPari/forgecode/releases/latest",
                "jsonpath": "$.tag_name",
                "regex": "v([0-9]+[.][0-9]+[.][0-9]+(?:-[a-z][.]?[0-9]+[.][0-9]+[.][0-9]+)?)"
            },
            "autoupdate": {
                "architecture": {
                    "64bit": {
                        "url": "https://github.com/KooshaPari/forgecode/releases/download/v\$version/forge-x86_64-pc-windows-msvc.exe"
                    },
                    "arm64": {
                        "url": "https://github.com/KooshaPari/forgecode/releases/download/v\$version/forge-aarch64-pc-windows-msvc.exe"
                    }
                }
            }
        }
        EOF
    - name: Commit and push changes
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add distribution/ packaging/
        if git diff --staged --quiet; then
          echo "No distribution changes to commit"
          exit 0
        fi
        BRANCH="chore/distribution-${{ inputs.tag || github.event.release.tag_name }}"
        git checkout -b "$BRANCH"
        git commit -m "chore(distribution): update Homebrew, Scoop, and packaging manifests for ${{ inputs.tag || github.event.release.tag_name }}"
        git push origin "$BRANCH"
        gh pr create \
          --title "chore(distribution): update manifests for ${{ inputs.tag || github.event.release.tag_name }}" \
          --body "Auto-generated distribution manifest updates for release ${{ inputs.tag || github.event.release.tag_name }}." \
          --base main \
          --head "$BRANCH" || echo "PR already exists or creation failed"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
