# CVP — Continuous Validation Pipeline for HeliosLite
#
# Validates cross-consumption of PhenoShared crates, full workspace
# compilation, tests, lint, and coverage. Runs on push to main and PRs.

name: cvp

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTFLAGS: "-Dwarnings"

jobs:
  # ── Gate 1: Cross-consumption validation ──────────────────────
  cross-consumption:
    name: "CVP: PhenoShared cross-consumption"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cvp-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Verify PhenoShared deps resolve
        run: |
          set -euo pipefail
          cargo fetch 2>&1 | tee /tmp/cvp-fetch.log
          echo "✓ Dependencies fetched"
      - name: Check cross-consumed crates compile
        run: |
          cargo check -p phenotype-health -p phenotype-observability -p phenotype-telemetry 2>&1
          echo "✓ Cross-consumed crates compile"
      - name: Verify rev pin or path consistency
        run: |
          if grep -q 'PhenoShared.git' Cargo.toml; then
            # The three cross-consumed deps (phenotype-health,
            # phenotype-observability, phenotype-telemetry) must agree on a
            # single rev. Comparing against a hard-coded rev value instead made
            # this job fail on every legitimate repin (e.g. 68beca26 ->
            # cf914698, which is the Windows path/invalid-char fix).
            PINS=$(grep 'PhenoShared.git' Cargo.toml | sed -n 's/.*rev = "\([^"]*\)".*/\1/p' | sort -u)
            TOTAL=$(grep -c 'PhenoShared.git' Cargo.toml)
            DISTINCT=$(printf '%s\n' "$PINS" | grep -c .)
            if [ "$DISTINCT" -ne 1 ] || [ -z "$PINS" ]; then
              echo "✗ PhenoShared rev pins disagree or are missing: ${PINS:-<none>}"
              exit 1
            fi
            echo "✓ Rev pin consistent across $TOTAL deps: $PINS"
          else
            echo "✓ Using local path deps (CI should switch to git rev pin)"
          fi
      - name: Guard - no workflow may install into $HOME/.cargo/bin
        run: |
          set -euo pipefail
          # On rustup-based runners `$HOME/.cargo/bin/rust-analyzer` is a SYMLINK
          # to the rustup binary, so a redirect such as `> "$bin"` follows it and
          # overwrites rustup itself. Every shim (cargo, rustc, cargo-clippy, ...)
          # then becomes the rust-analyzer binary: `cargo clippy` answers
          # `unexpected argument: "clippy"` and `rustc -vV` prints
          # `rust-analyzer 0.3.3049-standalone`. Diagnosing that cost hours, and
          # the fix is easy to undo by accident, so it is enforced here.
          # Install tooling into $RUNNER_TEMP instead.
          # See docs/sessions/20260918-release-ci-handoff/HANDOFF.md section 4.6.
          if grep -rnE '(bin|dest|target|out)="\$HOME/\.cargo/bin/|> *"\$HOME/\.cargo/bin/' .github/workflows/*.yml; then
            echo "::error::a workflow installs into \$HOME/.cargo/bin; use \$RUNNER_TEMP (HANDOFF.md 4.6)"
            exit 1
          fi
          echo "✓ No workflow writes into \$HOME/.cargo/bin"

  # ── Gate 2: Full workspace build ─────────────────────────────
  build:
    name: "CVP: Full workspace build"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cvp-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: cargo check --workspace
        run: cargo check --workspace 2>&1

  # ── Gate 3: Tests ────────────────────────────────────────────
  test:
    name: "CVP: Workspace tests"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cvp-test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Install typescript-language-server
        shell: bash
        run: |
          set -euo pipefail
          # forge_lsp::Server::with_defaults spawns BOTH rust-analyzer and
          # typescript-language-server, and crates/forge_lsp/tests/
          # e2e_rust_analyzer.rs exercises that production path whenever
          # rust-analyzer is available. Without the TS server the test panics
          # with `failed to spawn "typescript-language-server"` (run
          # 35339166638, ubuntu). Installing it keeps the e2e test real instead
          # of weakening it.
          npm install -g typescript-language-server typescript
          typescript-language-server --version
      # PR #308 (test(lsp): add e2e integration test against real rust-analyzer
      # binary) added `crates/forge_lsp/tests/e2e_rust_analyzer.rs`, which
      # silently passes when `rust-analyzer` is not on PATH. Installing the
      # prebuilt rust-analyzer here makes the workspace tests actually exercise
      # the LSP round-trip instead of taking the early-return skip path.
      - name: Install rust-analyzer
        shell: bash
        run: |
          set -euo pipefail
          # Install into a dedicated dir, NEVER into $HOME/.cargo/bin: on
          # rustup-based setups `$HOME/.cargo/bin/rust-analyzer` is a symlink to
          # the `rustup` binary, so `> "$bin"` follows it and overwrites rustup
          # itself. Every shim (cargo, rustc, cargo-clippy, ...) then becomes the
          # rust-analyzer binary, producing nonsense like
          # `unexpected argument: "clippy"` (run 35336692859) and
          # `rustc -vV` printing `rust-analyzer 0.3.3049-standalone`
          # (run 35334658326).
          install_dir="$RUNNER_TEMP/rust-analyzer-bin"
          mkdir -p "$install_dir"
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$install_dir/rust-analyzer" ;;
            Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$install_dir/rust-analyzer" ;;
            Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$install_dir/rust-analyzer" ;;
            Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$install_dir/rust-analyzer" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
              asset="rust-analyzer-x86_64-pc-windows-msvc"
              bin="$install_dir/rust-analyzer.exe" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
              asset="rust-analyzer-aarch64-pc-windows-msvc"
              bin="$install_dir/rust-analyzer.exe" ;;
            *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
          # rm first so a stale symlink can never be followed by the redirect.
          rm -f "$bin"
          if [[ "$bin" == *.exe ]]; then
            tmp="$(mktemp -d)/${asset}.zip"
            curl -fsSL "${url}.zip" -o "$tmp"
            unzip -q -o "$tmp" -d "$install_dir"
            rm -rf "$(dirname "$tmp")"
          else
            curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
            chmod +x "$bin"
          fi
          "$bin" --version
          # Put only the isolated dir on PATH for later steps. $GITHUB_PATH is the
          # canonical GH Actions mechanism and, on the windows-2022 image, the
          # only reliable way to extend PATH.
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run workspace tests
        run: cargo test --workspace --all-features 2>&1

  # ── Gate 4: Lint ─────────────────────────────────────────────
  lint:
    name: "CVP: Clippy + format"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
        with:
          components: clippy, rustfmt
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cvp-lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Format check
        run: cargo fmt --all -- --check 2>&1
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings 2>&1

  # ── Gate 5: Coverage ─────────────────────────────────────────
  coverage:
    name: "CVP: Coverage"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cvp-cov-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Generate coverage
        run: |
          cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info 2>&1
          echo "✓ Coverage generated"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
          retention-days: 30
