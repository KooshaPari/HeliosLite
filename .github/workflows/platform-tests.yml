name: Platform Tests
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  platform_matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    # The `phenotype-observability` git dependency (PhenoShared@pinned rev)
    # contains tracked file paths that, combined with cargo's checkout prefix
    # under `C:/Users/runneradmin/.cargo/git/checkouts/...`, exceed the Windows
    # MAX_PATH limit of 260 characters (observed: 265 chars, run 35212201779:
    # "path too long ... class=Filesystem (30)"). libgit2 honors
    # `core.longpaths` for working-directory paths (libgit2 docs/
    # win32-longpaths.md), so enabling it before any cargo invocation fixes
    # the checkout. Harmless no-op on macOS/Linux.
    - name: Enable git long paths
      shell: bash
      run: git config --global core.longpaths true
    # Upstream (gfx-rs/wgpu#9543, fixed by #9544): a Rust cache restored from a
    # different runner image version leaves `cargo` resolving to `rustup-init`,
    # so `cargo test`/`cargo clippy` fail instantly with
    # `unexpected argument: "test"` (observed on macos-latest, run 35212201779).
    # Fix: include the runner image version in the rust-cache key. The
    # `ImageVersion` env var is provided by GitHub-hosted runner images; it is
    # exported to GITHUB_ENV here so it can be referenced as an expression in
    # the setup-rust-toolchain `cache-key` input below.
    - name: Export runner image version
      shell: bash
      run: echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: stable
        # NOTE: the input is singular `target`; a plural `targets:` input is
        # rejected by this pinned action revision with "Unexpected input(s)
        # 'targets'" (observed in run 35212201779 logs).
        target: ${{ matrix.target }}
        cache-key: ${{ env.RUNNER_IMAGE_VERSION }}
        # Do NOT restore ~/.cargo/bin from cache. An entry saved by an earlier
        # (failed) run contains a broken `cargo`: every later run restored it
        # over the freshly installed rustup proxies, and every cargo subcommand
        # then died with `unexpected argument: "<subcommand>"` (exit 2).
        # Evidence (run 35334658204, job 105566622062): `cargo --version`
        # succeeds at 10:26:32, the cache restore completes at 10:26:33, and
        # `cargo test` fails at 10:26:34 -- so the restored bin dir is the
        # poison. `cache-on-failure: true` keeps re-saving that entry, so it
        # must not be restored at all.
        cache-bin: false

    # Guard against a repeat of the poisoned-bin-dir failure above: fail loudly
    # and print diagnostics instead of letting every later cargo invocation fail
    # with a confusing `unexpected argument` error.
    - name: Verify cargo toolchain
      shell: bash
      run: |
        set -euo pipefail
        if ! cargo --list >/dev/null 2>&1 || ! cargo metadata --no-deps --format-version 1 >/dev/null 2>&1; then
          echo "::error::cargo is not a working rustup proxy: $(command -v cargo)"
          cargo --version || true
          ls -la "$HOME/.cargo/bin" | head -20
          exit 1
        fi
        # A restored/clobbered ~/.cargo/bin can leave `rustc` pointing at a
        # non-compiler (observed: the rust-analyzer binary). Catch that here
        # instead of letting clippy/test fail with a cryptic message.
        if ! rustc -vV | grep -q '^host: '; then
          echo "::error::rustc is not a working compiler: $(command -v rustc)"
          rustc -vV || true
          ls -la "$HOME/.cargo/bin" | head -20
          exit 1
        fi
        cargo --version
        rustc -vV | grep -E '^(rustc|host):'

    # PR #308 (test(lsp): add e2e integration test against real rust-analyzer
    # binary) added `crates/forge_lsp/tests/e2e_rust_analyzer.rs`, which
    # silently passes when `rust-analyzer` is not on PATH. Installing the
    # prebuilt rust-analyzer here makes `cargo test --workspace` actually
    # exercise the LSP round-trip on the macOS and Windows matrix runners
    # instead of taking the early-return skip path.
    - name: Install rust-analyzer
      shell: bash
      run: |
        set -euo pipefail
        # Install into a dedicated dir, NEVER into $HOME/.cargo/bin: on
        # rustup-based setups `$HOME/.cargo/bin/rust-analyzer` is a symlink to
        # the `rustup` binary, so `> "$bin"` follows it and overwrites rustup
        # itself. Every shim (cargo, rustc, cargo-clippy, ...) then becomes the
        # rust-analyzer binary, producing nonsense like
        # `unexpected argument: "clippy"` (run 35336692859) and
        # `rustc -vV` printing `rust-analyzer 0.3.3049-standalone`
        # (run 35334658326).
        install_dir="$RUNNER_TEMP/rust-analyzer-bin"
        mkdir -p "$install_dir"
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$install_dir/rust-analyzer" ;;
          Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$install_dir/rust-analyzer" ;;
          Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$install_dir/rust-analyzer" ;;
          Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$install_dir/rust-analyzer" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
            asset="rust-analyzer-x86_64-pc-windows-msvc"
            bin="$install_dir/rust-analyzer.exe" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
            asset="rust-analyzer-aarch64-pc-windows-msvc"
            bin="$install_dir/rust-analyzer.exe" ;;
          *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
        esac
        url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
        # rm first so a stale symlink can never be followed by the redirect.
        rm -f "$bin"
        if [[ "$bin" == *.exe ]]; then
          tmp="$(mktemp -d)/${asset}.zip"
          curl -fsSL "${url}.zip" -o "$tmp"
          unzip -q -o "$tmp" -d "$install_dir"
          rm -rf "$(dirname "$tmp")"
        else
          curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
          chmod +x "$bin"
        fi
        "$bin" --version
        # Put only the isolated dir on PATH for later steps. $GITHUB_PATH is the
        # canonical GH Actions mechanism and, on the windows-2022 image, the
        # only reliable way to extend PATH.
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Run tests
      run: cargo test --workspace
      continue-on-error: true
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
    - name: Check formatting
      run: cargo fmt --all -- --check
