name: Platform Tests
on:
  push:
    branches:
    - main
  pull_request:
    types:
    - opened
    - synchronize
    - reopened

concurrency:
  group: platform-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
jobs:
  platform_matrix:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          target: aarch64-apple-darwin
        - os: windows-latest
          target: x86_64-pc-windows-msvc
    permissions:
      contents: read
    steps:
    - name: Checkout Code
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
    # The `phenotype-observability` git dependency (PhenoShared@pinned rev)
    # contains tracked file paths that, combined with cargo's checkout prefix
    # under `C:/Users/runneradmin/.cargo/git/checkouts/...`, exceed the Windows
    # MAX_PATH limit of 260 characters (observed: 265 chars, run 35212201779:
    # "path too long ... class=Filesystem (30)"). libgit2 honors
    # `core.longpaths` for working-directory paths (libgit2 docs/
    # win32-longpaths.md), so enabling it before any cargo invocation fixes
    # the checkout. Harmless no-op on macOS/Linux.
    - name: Enable git long paths
      shell: bash
      run: git config --global core.longpaths true
    # Upstream (gfx-rs/wgpu#9543, fixed by #9544): a Rust cache restored from a
    # different runner image version leaves `cargo` resolving to `rustup-init`,
    # so `cargo test`/`cargo clippy` fail instantly with
    # `unexpected argument: "test"` (observed on macos-latest, run 35212201779).
    # Fix: include the runner image version in the rust-cache key. The
    # `ImageVersion` env var is provided by GitHub-hosted runner images; it is
    # exported to GITHUB_ENV here so it can be referenced as an expression in
    # the setup-rust-toolchain `cache-key` input below.
    - name: Export runner image version
      shell: bash
      run: echo "RUNNER_IMAGE_VERSION=$ImageVersion" >> "$GITHUB_ENV"
    - name: Setup Protobuf Compiler
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Setup Rust Toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: stable
        # NOTE: the input is singular `target`; a plural `targets:` input is
        # rejected by this pinned action revision with "Unexpected input(s)
        # 'targets'" (observed in run 35212201779 logs).
        target: ${{ matrix.target }}
        cache-key: ${{ env.RUNNER_IMAGE_VERSION }}

    # PR #308 (test(lsp): add e2e integration test against real rust-analyzer
    # binary) added `crates/forge_lsp/tests/e2e_rust_analyzer.rs`, which
    # silently passes when `rust-analyzer` is not on PATH. Installing the
    # prebuilt rust-analyzer here makes `cargo test --workspace` actually
    # exercise the LSP round-trip on the macOS and Windows matrix runners
    # instead of taking the early-return skip path.
    - name: Install rust-analyzer
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)/$(uname -m)" in
          Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$HOME/.cargo/bin/rust-analyzer" ;;
          Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$HOME/.cargo/bin/rust-analyzer" ;;
          Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$HOME/.cargo/bin/rust-analyzer" ;;
          Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$HOME/.cargo/bin/rust-analyzer" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
            asset="rust-analyzer-x86_64-pc-windows-msvc"
            bin="$HOME/.cargo/bin/rust-analyzer.exe" ;;
          MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
            asset="rust-analyzer-aarch64-pc-windows-msvc"
            bin="$HOME/.cargo/bin/rust-analyzer.exe" ;;
          *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p "$(dirname "$bin")"
        url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
        if [[ "$bin" == *.exe ]]; then
          tmp="$(mktemp -d)/${asset}.zip"
          curl -fsSL "${url}.zip" -o "$tmp"
          unzip -q -o "$tmp" -d "$(dirname "$bin")"
          rm -rf "$(dirname "$tmp")"
        else
          curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
          chmod +x "$bin"
        fi
        "$bin" --version
        # Make sure the test step's `which rust-analyzer` (or `where
        # rust-analyzer` on Windows) lookup finds the binary we just
        # installed. $GITHUB_PATH is the canonical GH Actions mechanism for
        # adding a directory to PATH for all subsequent steps.
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Run tests
      run: cargo test --workspace
      continue-on-error: true
    - name: Run clippy
      run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
    - name: Check formatting
      run: cargo fmt --all -- --check
