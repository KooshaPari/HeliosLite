# helios-lite-nightly — Gate 5b
#
# Coordinates the nightly reset/dev-publish path on the renamed-binary
# surface. Runs every day at 06:30 UTC after the Omniroute nightly
# (`argismonitor-nightly.yml`) so the rename cycles stay deterministic.
#
# Cron:
#   cron: '30 6 * * *'

name: helios-lite-nightly

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-nightly-container:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HELIOSLITE_REPO: ${{ github.repository }}
      HELIOSLITE_RELEASES_BACKEND: "github"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          components: rustfmt, clippy

      - name: Set up protobuf compiler
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo registry/target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: helios-nightly-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo fmt + clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      # PR #308 (test(lsp): add e2e integration test against real rust-analyzer
      # binary) added `crates/forge_lsp/tests/e2e_rust_analyzer.rs`, which
      # silently passes when `rust-analyzer` is not on PATH. Installing the
      # prebuilt rust-analyzer here makes the nightly `cargo test --workspace`
      # actually exercise the LSP round-trip instead of taking the early-return
      # skip path.
      - name: Install rust-analyzer
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)/$(uname -m)" in
            Linux/x86_64)  asset="rust-analyzer-x86_64-unknown-linux-gnu"  bin="$HOME/.cargo/bin/rust-analyzer" ;;
            Linux/aarch64) asset="rust-analyzer-aarch64-unknown-linux-gnu" bin="$HOME/.cargo/bin/rust-analyzer" ;;
            Darwin/x86_64) asset="rust-analyzer-x86_64-apple-darwin"       bin="$HOME/.cargo/bin/rust-analyzer" ;;
            Darwin/arm64)  asset="rust-analyzer-aarch64-apple-darwin"      bin="$HOME/.cargo/bin/rust-analyzer" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/x86_64)
              asset="rust-analyzer-x86_64-pc-windows-msvc"
              bin="$HOME/.cargo/bin/rust-analyzer.exe" ;;
            MINGW*|MSYS*|CYGWIN*|Windows_NT/aarch64)
              asset="rust-analyzer-aarch64-pc-windows-msvc"
              bin="$HOME/.cargo/bin/rust-analyzer.exe" ;;
            *) echo "::error::unsupported platform: $(uname -s)/$(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$(dirname "$bin")"
          url="https://github.com/rust-lang/rust-analyzer/releases/latest/download/${asset}"
          if [[ "$bin" == *.exe ]]; then
            tmp="$(mktemp -d)/${asset}.zip"
            curl -fsSL "${url}.zip" -o "$tmp"
            unzip -q -o "$tmp" -d "$(dirname "$bin")"
            rm -rf "$(dirname "$tmp")"
          else
            curl -fsSL "${url}.gz" | gunzip -c - > "$bin"
            chmod +x "$bin"
          fi
          "$bin" --version
          # Make sure the test step's `which rust-analyzer` lookup finds the
          # binary we just installed. $GITHUB_PATH is the canonical GH Actions
          # mechanism for adding a directory to PATH for all subsequent steps.
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: cargo test (workspace)
        run: |
          cargo test --workspace --all-features --quiet

      - name: Build renamed binary
        run: |
          cargo build --release -p forge_main --bin helioslite
          cargo build --release -p forge_main --bin forge-dev --features dev-binary

      - name: Smoke-test renamed binary
        run: ./target/release/helioslite --version

      - name: Upload named artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: helioslite-nightly-${{ github.run_number }}
          path: |
            target/release/helioslite
            target/release/forge-dev

  notify-track:
    runs-on: ubuntu-latest
    needs: rebuild-nightly-container
    if: always()
    steps:
      - name: Emit GitHub event
        run: |
          echo "helios-lite-nightly: ${{ needs.rebuild-nightly-container.result }}"
          echo "ship-to-tracker: phenomonitor://nightly?project=helioslite&date=$(date -u +%Y-%m-%d)"
